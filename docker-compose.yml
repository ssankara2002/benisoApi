services:
  # Base de données PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: beniso-ecole-db
    restart: unless-stopped
    command: postgres -c max_connections=200
    environment:
      POSTGRES_USER: ${DB_USER:-beniso_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD obligatoire}
      POSTGRES_DB: ${DB_NAME:-beniso_ecole}
    volumes:
      - beniso_ecole_postgres_data:/var/lib/postgresql/data
    networks:
      - beniso-ecole-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-beniso_user} -d ${DB_NAME:-beniso_ecole}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Node.js
  api:
    image: ssarata/beniso-ecole-api1:latest
    container_name: beniso-ecole-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 5000
      API_URL: ${API_URL}
      LICENCE_ENABLED: ${LICENCE_ENABLED:-false}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL obligatoire}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET obligatoire}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      FRONTEND_URL: ${FRONTEND_URL}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      AQILAS_AUTH_TOKEN: ${AQILAS_AUTH_TOKEN}
      AQILAS_SENDER_ID: ${AQILAS_SENDER_ID}
    ports:
      - "127.0.0.1:5001:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - beniso-ecole-network
    volumes:
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)}).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  beniso-ecole-network:
    name: beniso-ecole-network
    driver: bridge

volumes:
  beniso_ecole_postgres_data:
    name: beniso_ecole_postgres_data
    driver: local