name: Build and Deploy to VPS

on:
  push:
    branches:
      - main  # Déclenché sur push vers main
      - dev   # Déclenché sur push vers dev
  workflow_dispatch:  # Permet de déclencher manuellement

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout du code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Configuration de Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Login à Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 4. Build et push de l'image (sans cache pour forcer rebuild)
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          no-cache: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/gestion-ecole-api1:latest
            ${{ secrets.DOCKER_USERNAME }}/gestion-ecole-api1:${{ github.sha }}

      # 5. Déployer sur le VPS via SSH
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/gestion-ecole-api
            docker compose pull api
            docker compose up -d api

            # Attendre que le conteneur démarre
            sleep 5

            # Appliquer les changements de schéma Prisma
            echo "🔄 Application du schéma Prisma..."
            docker compose exec -T api npx prisma db push

            echo "✅ Déploiement réussi sur le VPS!"

      # 7. Notification de succès
      - name: Deployment success
        if: success()
        run: |
          echo "✅ Déploiement réussi!"
          echo "🌐 URL: https://admin.edutrackhub.cloud"
          echo "📚 Swagger: https://admin.edutrackhub.cloud/api-docs"
          echo "🔍 Health: https://admin.edutrackhub.cloud/health"

      # 8. Notification d'échec
      - name: Deployment failed
        if: failure()
        run: |
          echo "❌ Le déploiement a échoué!"
          echo "Consultez les logs ci-dessus pour plus de détails."
